services:

  # ─────────────────────────────────────────
  # PostgreSQL — base de données principale
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: autoflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: autoflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: autoflow
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - autoflow_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Redis — non utilisé par le workflow actuel.
  # Gardé pour un usage futur (cache / rate-limit).
  # Supprime ce service si tu ne t'en sers pas.
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: autoflow_redis
    restart: unless-stopped
    networks:
      - autoflow_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # n8n — orchestrateur de workflows
  # ─────────────────────────────────────────
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: autoflow_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Base de données
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: autoflow
      DB_POSTGRESDB_USER: autoflow
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # Clé de chiffrement des credentials n8n (IMPORTANT : à définir et ne jamais perdre)
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # Timezone
      GENERIC_TIMEZONE: Africa/Algiers
      TZ: Africa/Algiers
      # URL locale (à changer pour un vrai domaine HTTPS le jour du déploiement VPS)
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      # Autorise l'installation de nodes communautaires (nécessaire pour WAHA)
      N8N_COMMUNITY_PACKAGES_ENABLED: "true"
      # Email (via Mailhog) — sert uniquement aux emails internes de n8n
      # (invitations, reset mot de passe), PAS à la synthèse de leads,
      # qui passe par le node Gmail (credentials OAuth2 configurées dans l'UI).
      N8N_EMAIL_MODE: smtp
      N8N_SMTP_HOST: mailhog
      N8N_SMTP_PORT: 1025
      N8N_SMTP_SENDER: n8n@autoflow.local
    volumes:
      - ./data/n8n:/home/node/.n8n
    networks:
      - autoflow_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─────────────────────────────────────────
  # WAHA — WhatsApp HTTP API
  # Dashboard sur http://localhost:3001
  # ─────────────────────────────────────────
  waha:
    image: devlikeapro/waha
    container_name: autoflow_waha
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      WHATSAPP_DEFAULT_ENGINE: WEBJS
      WAHA_DASHBOARD_USERNAME: admin
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WAHA_API_KEY: ${WAHA_API_KEY}
    volumes:
      - ./data/waha:/app/.sessions
    networks:
      - autoflow_net

networks:
  autoflow_net:
    driver: bridge